<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalchitra — AI Clip Studio</title>
<style>
:root {
  --bg: #08080f;
  --surface: #111118;
  --surface2: #1a1a24;
  --border: #252535;
  --accent: #7c3aed;
  --accent2: #4f46e5;
  --text: #e2e8f0;
  --muted: #64748b;
  --success: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(135deg, #a78bfa, #818cf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}

.tagline { color: var(--muted); font-size: 13px; }

.container { max-width: 960px; margin: 0 auto; padding: 36px 24px; }

/* Upload zone */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: 20px;
  padding: 52px 32px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  background: var(--surface);
  margin-bottom: 32px;
  position: relative;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--accent);
  background: rgba(124,58,237,0.06);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(124,58,237,0.15);
}
.upload-icon { font-size: 52px; margin-bottom: 16px; display: block; }
.upload-zone h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.upload-zone p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
input[type=file] { display: none; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 24px; border-radius: 10px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
}
.btn-primary:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124,58,237,0.4); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Uploading bar */
.upload-status {
  display: none; align-items: center; gap: 12px;
  background: rgba(124,58,237,0.1);
  border: 1px solid rgba(124,58,237,0.3);
  border-radius: 12px; padding: 14px 20px;
  margin-bottom: 24px; font-size: 14px;
}
.spinner {
  width: 18px; height: 18px; flex-shrink: 0;
  border: 2px solid rgba(124,58,237,0.25);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Section heading */
.section-label {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin-bottom: 16px;
}

/* Episode card */
.ep-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  transition: border-color 0.3s;
}
.ep-card.complete { border-color: rgba(16,185,129,0.3); }

.ep-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; margin-bottom: 20px;
}
.ep-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.ep-meta { color: var(--muted); font-size: 12px; font-family: monospace; }
.ep-badge {
  font-size: 12px; font-weight: 600; padding: 4px 10px;
  border-radius: 20px; white-space: nowrap;
}
.ep-badge.processing { background: rgba(245,158,11,0.15); color: var(--warning); }
.ep-badge.complete   { background: rgba(16,185,129,0.15); color: var(--success); }
.ep-badge.failed     { background: rgba(239,68,68,0.15);  color: var(--error); }

/* Pipeline steps */
.pipeline {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 24px;
}
.pipe-step {
  background: var(--surface2);
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
  font-size: 11px; font-weight: 600;
  transition: all 0.3s;
}
.pipe-step .s-icon { font-size: 20px; display: block; margin-bottom: 5px; }
.pipe-step.pending   { color: var(--muted); }
.pipe-step.processing {
  background: rgba(245,158,11,0.1);
  border-color: rgba(245,158,11,0.35);
  color: var(--warning);
  animation: glow 1.5s ease-in-out infinite;
}
.pipe-step.done   { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--success); }
.pipe-step.failed { background: rgba(239,68,68,0.1);  border-color: rgba(239,68,68,0.3);  color: var(--error); }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 rgba(245,158,11,0); } 50% { box-shadow: 0 0 12px rgba(245,158,11,0.3); } }

/* Clips grid */
.clips-section { margin-top: 4px; }
.clips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }

.clip-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.clip-name { font-size: 13px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
.clip-why  { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
.clip-actions { display: flex; gap: 8px; }

.dl-btn {
  flex: 1; padding: 9px 10px;
  border-radius: 8px; font-size: 12px; font-weight: 600;
  text-align: center; text-decoration: none;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.dl-landscape {
  background: rgba(124,58,237,0.12);
  border: 1px solid rgba(124,58,237,0.35);
  color: #a78bfa;
}
.dl-landscape:hover { background: rgba(124,58,237,0.22); }
.dl-shorts {
  background: rgba(79,70,229,0.12);
  border: 1px solid rgba(79,70,229,0.35);
  color: #818cf8;
}
.dl-shorts:hover { background: rgba(79,70,229,0.22); }

.empty { text-align: center; padding: 60px 24px; color: var(--muted); font-size: 14px; }
.empty-icon { font-size: 40px; display: block; margin-bottom: 12px; }
</style>
</head>
<body>

<header>
  <span class="logo">🎬 Chalchitra</span>
  <span class="tagline">AI Clip Studio — Upload · Transcribe · Cut · Render</span>
</header>

<div class="container">

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
    <span class="upload-icon">📹</span>
    <h2>Drop your video here</h2>
    <p>MP4, MOV, MKV, WebM, MP3, M4A — any length</p>
    <button class="btn btn-primary" id="uploadBtn" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">
      Choose File
    </button>
    <input type="file" id="fileInput" accept=".mp4,.mov,.mkv,.webm,.mp3,.m4a,.wav,.ogg">
  </div>

  <div class="upload-status" id="uploadStatus">
    <div class="spinner"></div>
    <span>Uploading and starting pipeline…</span>
  </div>

  <div id="episodesWrap"></div>

</div>

<script>
const STEPS = ['transcribe','enrich','detect','ffmpeg','render'];
const LABELS = { transcribe:'Transcribe', enrich:'Enrich', detect:'Detect', ffmpeg:'Cut Clips', render:'Render' };
const ICONS  = { transcribe:'🎙️', enrich:'✨', detect:'🎯', ffmpeg:'✂️', render:'🎬' };

let episodes = JSON.parse(localStorage.getItem('ch_episodes') || '{}');
const timers  = {};

// ── Upload ────────────────────────────────────────────────────────────────────
const zone       = document.getElementById('uploadZone');
const fileInput  = document.getElementById('fileInput');
const statusBar  = document.getElementById('uploadStatus');
const uploadBtn  = document.getElementById('uploadBtn');

zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) doUpload(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) doUpload(fileInput.files[0]); });

async function doUpload(file) {
  statusBar.style.display = 'flex';
  uploadBtn.disabled = true;
  zone.style.opacity = '0.5';
  zone.style.pointerEvents = 'none';

  try {
    const form = new FormData();
    form.append('file', file);
    const res  = await fetch('/api/upload/', { method: 'POST', body: form });
    const data = await res.json();
    const id   = data.episode_id;

    episodes[id] = { id, fileName: file.name, title: file.name, jobs: {}, clips: [], done: false, ts: Date.now() };
    save(); renderAll(); startPoll(id);
  } catch(e) {
    alert('Upload failed: ' + e.message);
  } finally {
    statusBar.style.display = 'none';
    uploadBtn.disabled = false;
    zone.style.opacity = '';
    zone.style.pointerEvents = '';
    fileInput.value = '';
  }
}

// ── Polling ───────────────────────────────────────────────────────────────────
function startPoll(id) {
  if (timers[id]) return;
  timers[id] = setInterval(() => poll(id), 3000);
  poll(id);
}

async function poll(id) {
  try {
    const [jr, er] = await Promise.all([
      fetch(`/api/jobs/${id}`),
      fetch(`/api/episodes/${id}`)
    ]);
    const jobs = await jr.json();
    const ep   = await er.json();

    episodes[id].jobs  = Object.fromEntries(jobs.map(j => [j.step, j]));
    if (ep.title) episodes[id].title = ep.title;
    if (ep.polished_clips) {
      try { episodes[id].clips = JSON.parse(ep.polished_clips); } catch {}
    }

    const allDone   = jobs.length && jobs.every(j => j.status === 'done');
    const anyFailed = jobs.some(j => j.status === 'failed');

    if (allDone || anyFailed) {
      episodes[id].done = true;
      clearInterval(timers[id]);
      delete timers[id];
    }
    save(); renderCard(id);
  } catch(e) { console.error(e); }
}

function save() { localStorage.setItem('ch_episodes', JSON.stringify(episodes)); }

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll() {
  const wrap = document.getElementById('episodesWrap');
  const ids  = Object.keys(episodes).sort((a,b) => (episodes[b].ts||0) - (episodes[a].ts||0));

  if (!ids.length) {
    wrap.innerHTML = `<div class="empty"><span class="empty-icon">🎞️</span>No episodes yet — upload a video above</div>`;
    return;
  }

  ids.forEach(id => {
    if (!document.getElementById(`ep-${id}`)) {
      const el = document.createElement('div');
      wrap.appendChild(el);
    }
    renderCard(id);
  });
}

function renderCard(id) {
  const ep  = episodes[id];
  const wrap = document.getElementById('episodesWrap');
  let card   = document.getElementById(`ep-${id}`);

  if (!card) { card = document.createElement('div'); wrap.prepend(card); }
  card.id        = `ep-${id}`;
  card.className = `ep-card ${ep.done ? 'complete' : ''}`;

  const allFailed = Object.values(ep.jobs).some(j => j.status === 'failed');
  const badge = ep.done
    ? (allFailed ? '<span class="ep-badge failed">❌ Failed</span>' : '<span class="ep-badge complete">✅ Done</span>')
    : '<span class="ep-badge processing">⏳ Processing</span>';

  const stepsHtml = STEPS.map(s => {
    const job    = ep.jobs[s];
    const status = job ? job.status : 'pending';
    const icon   = status === 'done' ? '✅' : status === 'processing' ? '⏳' : status === 'failed' ? '❌' : '⬜';
    return `<div class="pipe-step ${status}">
      <span class="s-icon">${icon}</span>${LABELS[s]}
    </div>`;
  }).join('');

  let clipsHtml = '';
  const goodClips = (ep.clips || []).filter(c => c.landscape_path || c.shorts_path);
  if (goodClips.length) {
    const cards = goodClips.map((c, i) => {
      const lf = c.landscape_path ? c.landscape_path.split('/').pop() : null;
      const sf = c.shorts_path    ? c.shorts_path.split('/').pop()    : null;
      const lBtn = lf ? `<a class="dl-btn dl-landscape" href="/files/${lf}" download>📺 Landscape</a>` : '';
      const sBtn = sf ? `<a class="dl-btn dl-shorts"    href="/files/${sf}" download>📱 Shorts</a>`    : '';
      return `<div class="clip-card">
        <div class="clip-name">${c.title || `Clip ${i+1}`}</div>
        <div class="clip-why">${c.reason || ''}</div>
        <div class="clip-actions">${lBtn}${sBtn}</div>
      </div>`;
    }).join('');
    clipsHtml = `<div class="section-label">Generated Clips</div><div class="clips-grid">${cards}</div>`;
  }

  card.innerHTML = `
    <div class="ep-top">
      <div>
        <div class="ep-name">${ep.title}</div>
        <div class="ep-meta">${id.split('-')[0]}…</div>
      </div>
      ${badge}
    </div>
    <div class="pipeline">${stepsHtml}</div>
    ${clipsHtml}
  `;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
renderAll();
Object.keys(episodes).forEach(id => { if (!episodes[id].done) startPoll(id); });
</script>
</body>
</html>
