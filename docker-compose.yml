services:
  transcription:
    build:
      context: ./services/transcription
      dockerfile: Dockerfile
    container_name: chalchitra-transcription
    ports:
      - "8001:8001"
    volumes:
      - ./shared/volumes:/app/shared/volumes
      - whisper_cache:/root/.cache/whisper
    restart: unless-stopped
    networks:
      - chalchitra
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

  enrich:
    build:
      context: ./services/enrich
      dockerfile: Dockerfile
    container_name: chalchitra-enrich
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - chalchitra
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_BACKEND=ollama
      - OLLAMA_MODEL=gemma3:4b
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  detect:
    build:
      context: ./services/detect
      dockerfile: Dockerfile
    container_name: chalchitra-detect
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - chalchitra
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_BACKEND=ollama
      - OLLAMA_MODEL=gemma3:4b
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ffmpeg:
    build:
      context: ./services/ffmpeg
      dockerfile: Dockerfile
    container_name: chalchitra-ffmpeg
    ports:
      - "8004:8004"
    volumes:
      - ./shared/volumes:/app/shared/volumes
    restart: unless-stopped
    networks:
      - chalchitra
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  renderer:
    build:
      context: ./services/renderer
      dockerfile: Dockerfile
    container_name: chalchitra-renderer
    ports:
      - "8006:8006"
    volumes:
      - ./shared/volumes:/app/shared/volumes
    restart: unless-stopped
    shm_size: "256mb"
    networks:
      - chalchitra
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama:
    image: ollama/ollama
    container_name: chalchitra-ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - chalchitra
    volumes:
      - ollama_data:/root/.ollama

  silence_detector:
    build: ./services/silence_detector
    ports:
      - "8008:8008"
    volumes:
      - ./shared/volumes:/app/shared/volumes
    networks:
      - chalchitra

  auto_editor:
    build: ./services/auto_editor
    ports:
      - "8010:8010"
    volumes:
      - ./shared/volumes:/app/shared/volumes
    networks:
      - chalchitra

  transcription_indic:
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - PYTHONUNBUFFERED=1
    build:
      context: ./services/transcription_indic
      dockerfile: Dockerfile
    container_name: chalchitra-transcription-indic
    ports:
      - "8011:8011"
    volumes:
      - ./shared/volumes:/app/shared/volumes
      - /Users/adityakumartonk/.cache/huggingface:/root/.cache/huggingface
    networks:
      - chalchitra
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  diarization:
    build: ./services/diarization
    container_name: chalchitra-diarization
    ports:
      - "8012:8012"
    volumes:
      - ./shared/volumes:/app/shared/volumes
    networks:
      - chalchitra
    restart: unless-stopped

  orchestrator:
    build: ./orchestrator
    ports:
      - "8007:8007"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./shared/volumes:/app/shared/volumes
    networks:
      - chalchitra
    depends_on:
      - transcription
      - enrich
      - detect
      - ffmpeg
      - renderer
      - silence_detector
      - auto_editor

  gateway:
    build: ./gateway
    container_name: chalchitra-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./shared/volumes:/app/shared/volumes
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - chalchitra
    depends_on:
      transcription:
        condition: service_healthy
      enrich:
        condition: service_healthy
      detect:
        condition: service_healthy
      ffmpeg:
        condition: service_healthy
      renderer:
        condition: service_healthy
      ollama:
        condition: service_started
      orchestrator:
        condition: service_started
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLM_BACKEND=ollama
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TRANSCRIPTION_URL=http://transcription:8001
      - ENRICH_URL=http://enrich:8002
      - DETECT_URL=http://detect:8003
      - FFMPEG_URL=http://ffmpeg:8004
      - RENDERER_URL=http://renderer:8006
      - ORCHESTRATOR_URL=http://orchestrator:8007/pipeline/start

  ui:
    image: nginx:alpine
    container_name: chalchitra-ui
    ports:
      - "3000:3000"
    volumes:
      - ./services/ui/index.html:/usr/share/nginx/html/index.html
      - ./services/ui/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./shared/volumes:/app/shared/volumes
    networks:
      - chalchitra
    restart: unless-stopped

networks:
  chalchitra:
    driver: bridge

volumes:
  ollama_data:
  whisper_cache:
  indic_model_cache:


