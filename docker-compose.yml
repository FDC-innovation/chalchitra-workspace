services:
  gateway:
    build: ./gateway
    container_name: chalchitra-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./shared/volumes:/app/data
    env_file:
      - .env
    depends_on:
      - transcription
      - enrich
      - detect
      - ffmpeg
      - n8n
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TRANSCRIPTION_URL=http://transcription:8001
      - ENRICH_URL=http://enrich:8002
      - DETECT_URL=http://detect:8003
      - FFMPEG_URL=http://ffmpeg:8004
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook-test/chalchitra
    networks:
      - chalchitra

  transcription:
    build:
      context: ./services/transcription
      dockerfile: Dockerfile
    container_name: chalchitra-transcription
    ports:
      - "8001:8001"
    volumes:
      - ./shared/volumes:/app/data
    networks:
      - chalchitra

  enrich:
    build:
      context: ./services/enrich
      dockerfile: Dockerfile
    container_name: chalchitra-enrich
    ports:
      - "8002:8002"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - chalchitra

  detect:
    build:
      context: ./services/detect
      dockerfile: Dockerfile
    container_name: chalchitra-detect
    ports:
      - "8003:8003"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - chalchitra

  ffmpeg:
    build:
      context: ./services/ffmpeg
      dockerfile: Dockerfile
    container_name: chalchitra-ffmpeg
    ports:
      - "8004:8004"
    volumes:
      - ./shared/volumes:/app/data
    networks:
      - chalchitra

  n8n:
    image: n8nio/n8n
    container_name: chalchitra-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678
      - N8N_SECURE_COOKIE=false
    networks:
      - chalchitra

networks:
  chalchitra:
    driver: bridge

volumes:
  n8n_data:
