services:
  transcription:
    build:
      context: ./services/transcription
      dockerfile: Dockerfile
    container_name: chalchitra-transcription
    ports:
      - "8001:8001"
    volumes:
      - ./shared/volumes:/app/data
      - whisper_cache:/root/.cache/whisper
    restart: unless-stopped
    networks:
      - chalchitra
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

  enrich:
    build:
      context: ./services/enrich
      dockerfile: Dockerfile
    container_name: chalchitra-enrich
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - chalchitra
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  detect:
    build:
      context: ./services/detect
      dockerfile: Dockerfile
    container_name: chalchitra-detect
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - chalchitra
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ffmpeg:
    build:
      context: ./services/ffmpeg
      dockerfile: Dockerfile
    container_name: chalchitra-ffmpeg
    ports:
      - "8004:8004"
    volumes:
      - ./shared/volumes:/app/data
    restart: unless-stopped
    networks:
      - chalchitra
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  renderer:
    build:
      context: ./services/renderer
      dockerfile: Dockerfile
    container_name: chalchitra-renderer
    ports:
      - "8006:8006"
    volumes:
      - ./shared/volumes:/app/data
    restart: unless-stopped
    shm_size: "256mb"
    networks:
      - chalchitra
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama:
    image: ollama/ollama
    container_name: chalchitra-ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - chalchitra
    volumes:
      - ollama_data:/root/.ollama

  n8n:
    image: n8nio/n8n
    container_name: chalchitra-n8n
    ports:
      - "5678:5678"
    restart: unless-stopped
    networks:
      - chalchitra
    volumes:
      - n8n_data:/home/node/.n8n
      - ./shared/volumes:/app/data
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all

  gateway:
    build: ./gateway
    container_name: chalchitra-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./shared/volumes:/app/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - chalchitra
    depends_on:
      transcription:
        condition: service_healthy
      enrich:
        condition: service_healthy
      detect:
        condition: service_healthy
      ffmpeg:
        condition: service_healthy
      renderer:
        condition: service_healthy
      ollama:
        condition: service_started
      n8n:
        condition: service_started
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLM_BACKEND=ollama
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TRANSCRIPTION_URL=http://transcription:8001
      - ENRICH_URL=http://enrich:8002
      - DETECT_URL=http://detect:8003
      - FFMPEG_URL=http://ffmpeg:8004
      - RENDERER_URL=http://renderer:8006
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook-test/chalchitra

networks:
  chalchitra:
    driver: bridge

volumes:
  ollama_data:
  n8n_data:
  whisper_cache:
